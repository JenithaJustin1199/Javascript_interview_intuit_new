<!doctype html>
<html>
    <head>
        <title>Invitations</title>
        <meta charset="utf-8">
        <style>
            *{
                box-sizing: border-box
            }
            body{
                padding: 20px;
                margin:0;
                background: grey;
            }

            /* Block: invitations (the whole panel) */
            .invitations{
                max-width: 640px;
                background: white;
                margin: auto;
                padding: 3px;
                border-radius: 8px;
                border: 1px solid #ddd;
            }
            .invitations__header{
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid #ddd;
                padding: 12px 16px;
            }
            .invitations__title{
                font-size: 1rem;
                margin: 0
            }
            .invitations__list{
                list-style: none;
                margin: 0;
                padding: 0;
            }

            /* Block: invitation (one row) */
            .invitation{
                display: flex;
                align-items: center;
                border-bottom: 1px solid #ddd;
                padding: 12px 16px;
                gap: 12px;
            }
            .invitation__avatar{
                width : 50px;
                height: 50px;
                border-radius: 50%;
                border: 3px solid #eee;
                background-color: lightblue;
            }
            .invitation__info{
                flex:1
            }
            .invitation__name{
                font-size: 1rem;
            }
            .invitation__role,
            .invitation__mutual{
                font-size: 0.8rem;
                color: grey;
            }
            .invitation__actions{
                display: flex;
                gap: 8px
            }
            .invitation__btn{
                border-radius: 1000px;
                cursor: pointer;
                padding : 6px;
                font-size: 0.9rem;
            }
            .invitation__btn--ignore{
                background: none;
                border: none;
            }
            .invitation__btn--accept{
                color: blue;
                border: 1px solid blue;
            }
        </style>
    </head>
    <body>
        <main>
            <section class="invitations" aria-labelledby="inv-title">
                <header class="invitations__header">
                    <h1 id="inv-title" class="invitations__title">Invitations (<span id="inv-count">0</span>)</h1>
                </header>

                <ul id="inv-list" class="invitations__list" aria-labelledby="inv-title">

                </ul>
                <p id="inv-empty" class="invitations__empty" hidden>No Pending Invitation</p>

            </section>
        </main>
        <template id="inv-template">
            <li class="invitation">
                <img class="invitation__avatar" alt="Pofile"/>
                <div class="invitation__info">
                    <h2 class="invitation__name">

                    </h2>
                    <p class="invitation__role">

                    </p>
                    <p class="invitation__mutual">

                    </p>

                </div>
                <div class="invitation__actions">
                    <button type="button" class="invitation__btn invitation__btn--ignore" data-action="ignore"> Ignore</button>
                    <button type="button" class="invitation__btn invitation__btn--accept" data-action="accept"> Accept</button>

                </div>


            </li>
        </template>
        <script>

            let invitation = [
                {
                    id:1,
                    name: 'Priya',
                    role: 'Senior Engineer at Flipkart',
                    profile: "",
                    mutual: 17
                },
                {
                    id:2,
                    name: 'Jenitha',
                    role: 'Senior Engineer at Zeta',
                    profile: "",
                    mutual: 12
                },
                {
                    id:3,
                    name: 'Ajaay',
                    role: 'Senior Engineer at Qualcomm',
                    profile: "",
                    mutual: 15
                }
            ]
            let list = document.getElementById("inv-list")
            let template = document.getElementById("inv-template")
            let count = document.getElementById("inv-count")
            let empty = document.getElementById("inv-empty")

            function createItem({id,name,role,profile,mutual}){

                let li = template.content.firstElementChild.cloneNode(true)
                li.dataset.id = id
                li.querySelector('.invitation__avatar').src = profile
                li.querySelector('.invitation__name').textContent = name
                li.querySelector('.invitation__role').textContent = role
                li.querySelector('.invitation__mutual').textContent= `${mutual} Mutual connections`
                li.querySelector('.invitation__btn--accept').setAttribute('aria-label',`Accept Inviation from ${name}`)
                li.querySelector('.invitation__btn--ignore').setAttribute('aria-label',`Ingnore Inviation from ${name}`)
                return li

            }

            function render(){
                list.replaceChildren(...invitation.map(createItem))
                count.textContent = invitation.length
                empty.hidden = invitation.length

            }

            function removeItem(id,li){

                invitation = invitation.filter((x)=>x.id !=id)
                li.remove()
                count.textContent = invitation.length
                empty.hidden = invitation.length > 0
            }


            list.addEventListener('click',(e)=>{
                let btn = e.target.closest('button')
                if(!btn) return
                const li = btn.closest('li')
                let id = Number(li.dataset.id)
                let action = btn.dataset.action
                removeItem(id,li)
            })
            render()

        </script>
    </body>
</html>
