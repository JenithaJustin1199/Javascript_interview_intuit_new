<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>People you may know</title>
        <style>

            *{
                box-sizing: border-box;
            }
            body{
                margin: 0;
                padding: 24px 16px;
                font-family: system-ui, sans-serif;
                color: #1d2226;
                background: #f3f2ef;
            }

            /* Block: pymk (the whole panel) */
            .pymk{
                max-width: 960px;
                margin: auto;
                padding: 16px;
                background: white;
                border: 1px solid #ddd;
                border-radius: 8px;
            }
            .pymk__header{
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 16px;
            }
            .pymk__title{
                font-size: 1rem;
                margin: 0;
            }
            .pymk__see-all{
                border: 0;
                background: none;
                color: #666;
                font-weight: 600;
                cursor: pointer;
            }
            .pymk__grid{
                list-style: none;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr));
                gap: 12px;
                margin: 0;
                padding: 0;
            }
            .pymk__empty{
                margin: 24px 0;
                text-align: center;
                color: #666;
            }

            /* Block: person-card (one suggestion) */
            .person-card{
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding-bottom: 12px;
                border: 1px solid #ddd;
                border-radius: 8px;
                overflow: hidden;
            }
            .person-card__cover{
                width: 100%;
                height: 56px;
                background-color: lightblue;
            }
            .person-card__dismiss{
                position: absolute;
                top: 8px;
                right: 8px;
                width: 28px;
                height: 28px;
                border: 0;
                border-radius: 50%;
                background: #555;
                color: white;
                cursor: pointer;
            }
            .person-card__avatar{
                width: 72px;
                height: 72px;
                margin-top: -36px;            /* overlap the cover */
                border: 3px solid white;
                border-radius: 50%;
                background-color: aliceblue;
                object-fit: cover;
            }
            .person-card__name{
                max-width: 100%;
                margin: 8px 0 0;
                padding: 0 12px;
                font-size: 0.95rem;
                font-weight: 600;
                white-space: nowrap;          /* one line ... */
                overflow: hidden;
                text-overflow: ellipsis;      /* ... with "…" when too long */
            }
            .person-card__headline{
                display: -webkit-box;         /* clamp to 2 lines */
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                overflow: hidden;
                margin: 4px 0 0;
                padding: 0 12px;
                color: #666;
                font-size: 0.8rem;
            }
            .person-card__mutual{
                margin: 8px 0 12px;
                padding: 0 12px;
                color: #666;
                font-size: 0.75rem;
            }
            .person-card__connect{
                width: calc(100% - 24px);
                height: 32px;
                margin-top: auto;             /* pin to bottom so buttons line up */
                border: 1px solid #2b5f9e;
                border-radius: 16px;
                background: white;
                color: #2b5f9e;
                font-weight: 600;
                cursor: pointer;
            }
            .person-card__connect:hover{
                background: #eef3f9;
            }
            .person-card__connect[aria-pressed="true"]{
                border-color: #666;
                color: #666;
            }

            .pymk__see-all:focus-visible,
            .person-card__dismiss:focus-visible,
            .person-card__connect:focus-visible{
                outline: 2px solid #2b5f9e;
                outline-offset: 2px;
            }


        </style>
        </head>
    <body>
        <main>
        <section id="pymk" class="pymk" aria-labelledby="pymk-header">
            <header class="pymk__header">
                <h1 id="pymk-header" class="pymk__title">People you may know</h1>
                <button id="see-all" class="pymk__see-all" type="button">See all</button>
            </header>
            <ul id="grid" class="pymk__grid"></ul>
            <p id="no-more" class="pymk__empty" hidden>No more Suggestions</p>
        </section>
        </main>
        <template id="card-template">
            <li class="person-card">
                <div class="person-card__cover"></div>
                <button type="button" data-action="dismiss" class="person-card__dismiss">✕</button>
                <img class="person-card__avatar" alt=""/>
                <h3 class="person-card__name"></h3>
                <p class="person-card__headline"></p>
                <p class="person-card__mutual"></p>

                <button class="person-card__connect" type="button" data-action="connect" aria-pressed="false"> + Connect</button>
            </li>
        </template>
        <script>

            const maxVisible = 6;
            let pending = new Set()

            let people = [
                {id:1, name:"Priya raja gokilam", headline:"Senior Software Engineer at DB", mutual:8, profile:''},
                {id:2, name:"Priya_1", headline:"Senior Software Engineer at DB", mutual:3, profile:''},
                {id:3, name:"Priya_2", headline:"Senior Software Engineer at DB", mutual:2, profile:''},
                {id:4, name:"Priya_3", headline:"Senior Software Engineer at DB", mutual:9, profile:''},
                {id:5, name:"Priya_4", headline:"Senior Software Engineer at DB", mutual:6, profile:''},
                {id:6, name:"Priya_5", headline:"Senior Software Engineer at DB", mutual:7, profile:''},
                {id:7, name:"Priya_6", headline:"Senior Software Engineer at DB", mutual:9, profile:''},
            ]
            let grid = document.getElementById('grid')
            let template = document.getElementById('card-template')
            let empty = document.getElementById("no-more")

            function createCard(person){
                let card = template.content.firstElementChild.cloneNode(true)
                card.dataset.id=person.id
                if(person.profile) card.querySelector('.person-card__avatar').src=person.profile
                card.querySelector('.person-card__name').textContent = person.name
                card.querySelector('.person-card__headline').textContent = person.headline
                card.querySelector('.person-card__mutual').textContent = `${person.mutual} mutual connections`;

                card.querySelector('.person-card__dismiss').setAttribute('aria-label', `Dismiss ${person.name}`)
                setConnection(card.querySelector('.person-card__connect'), person)

                return card


            }
            function render(){
                grid.replaceChildren(...people.slice(0,maxVisible).map((x)=>createCard(x)))
                empty.hidden = people.length>0
            }

            function setConnection(btn, person){
                let isPending = pending.has(person.id)
               btn.textContent=isPending?"Pending":"+ Connect"
               btn.setAttribute('aria-label', isPending?`Withdraw Invitation of ${person.name}`:`Add ${person.name} to your network`)
               btn.setAttribute('aria-pressed', String(isPending))
            }

            function removeConnection(card, person){
                const index = [...grid.children].indexOf(card)

                people = people.filter((x)=>x.id!==person.id)
                card.remove()

                // the person who was next in line is now at index maxVisible-1
                let next = people[maxVisible-1]
                if(next) grid.append(createCard(next))
                empty.hidden = people.length>0

                // keep keyboard focus near the dismissed card
                const nextCard = grid.children[index] || grid.children[index-1]
                const focusTarget = nextCard ? nextCard.querySelector('.person-card__dismiss') : document.getElementById('see-all')
                focusTarget.focus()
            }

            grid.addEventListener('click', (event)=>{
                let btn = event.target.closest('button')
                if(!btn) return
                let card = btn.closest('li')
                let id = Number(card.dataset.id)
                let action = btn.dataset.action

                let person = people.find((x)=>x.id===id)
                if(!person) return

                if(action === 'connect'){
                    pending.has(person.id) ? pending.delete(person.id) : pending.add(person.id)
                    setConnection(btn, person)
                }
                if(action === 'dismiss'){
                    removeConnection(card, person)
                }
            })
            render()

        </script>
    </body>
</html>
